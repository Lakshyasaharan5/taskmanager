spring.application.name=taskmanager

spring.datasource.url=jdbc:h2:mem:taskmanager
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:password}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.ai.openai.api-key=${OPENAI_API_KEY:}
ai.task-suggestion.timeout-seconds=15
ai.task-suggestion.model=${OPENAI_MODEL:gpt-4o}
ai.safety-check.model=${SAFETY_CHECK_MODEL:gpt-4o-mini}
ai.task-suggestion.cache-ttl-minutes=60
